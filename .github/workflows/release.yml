name: 构建并发布模组

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: 编译、回归与打包
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/build.py --standalone --jdk "$env:JAVA_HOME" --tag "$env:RELEASE_TAG"
      - name: 保存已验证的安装包
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spmod
          path: build/dist/*.spmod
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: 上传附件并公开 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.spmod)
          [[ ${#packages[@]} -eq 1 ]] || { echo 'Expected exactly one package'; exit 1; }
          # 失败重跑可恢复草稿，但不能覆盖已经公开的版本。
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Release already published'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
